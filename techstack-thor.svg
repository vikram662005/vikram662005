<!-- Frontend -->
<svg width="1160" height="650" viewBox="0 0 1160 650" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0b1225"/>
      <stop offset="100%" stop-color="#03050d"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong Glow -->
    <filter id="strongGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path d="M40 0H0V40"
            fill="none"
            stroke="#24304f"
            stroke-width="0.6"
            opacity="0.35"/>

    </pattern>

    <!-- Tech gradient -->
    <linearGradient id="lineGradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">

      <stop offset="0%" stop-color="#00eaff"/>
      <stop offset="50%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#ff4ecd"/>

    </linearGradient>

  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND                                             -->
  <!-- ===================================================== -->

  <rect width="1160"
        height="650"
        rx="22"
        fill="url(#bg)"/>

  <rect width="1160"
        height="650"
        rx="22"
        fill="url(#grid)"/>

  <rect x="1"
        y="1"
        width="1158"
        height="648"
        rx="21"
        fill="none"
        stroke="#263657"
        stroke-width="2"/>


  <!-- ===================================================== -->
  <!-- HEADER                                                 -->
