<svg width="1160" height="420" viewBox="0 0 1160 420" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ================= BACKGROUND ================= -->

    <linearGradient id="bg"
      x1="0%" y1="0%"
      x2="100%" y2="100%">

      <stop offset="0%" stop-color="#02030a"/>
      <stop offset="45%" stop-color="#071321"/>
      <stop offset="75%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#010207"/>

    </linearGradient>


    <!-- ================= CYAN GRADIENT ================= -->

    <linearGradient id="cyan"
      x1="0%" y1="0%"
      x2="100%" y2="0%">

      <stop offset="0%" stop-color="#00f6ff"/>
      <stop offset="50%" stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#7a5cff"/>

    </linearGradient>


    <!-- ================= GOLD GRADIENT ================= -->

    <linearGradient id="gold"
      x1="0%" y1="0%"
      x2="100%" y2="0%">

      <stop offset="0%" stop-color="#ff9d42"/>
      <stop offset="50%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#ff9d42"/>

    </linearGradient>


    <!-- ================= GRID ================= -->

    <pattern id="grid"
      width="35"
      height="35"
      patternUnits="userSpaceOnUse">

      <path
        d="M35 0H0V35"
        fill="none"
        stroke="#19334d"
        stroke-width="0.7"
        opacity="0.35"/>

    </pattern>


    <!-- ================= GLOW ================= -->

    <filter id="glow"
      x="-80%"
      y="-80%"
      width="260%"
      height="260%">

      <feGaussianBlur
        stdDeviation="3"
        result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <filter id="bigGlow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%">

      <feGaussianBlur
        stdDeviation="8"
        result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <!-- ================= RADIAL CORE ================= -->

    <radialGradient id="core">

      <stop offset="0%"
        stop-color="#ffffff"/>

      <stop offset="20%"
        stop-color="#00f6ff"/>

      <stop offset="55%"
        stop-color="#006dff"
        stop-opacity="0.7"/>

      <stop offset="100%"
        stop-color="#00152a"
        stop-opacity="0"/>

    </radialGradient>


    <!-- ================= SCAN GRADIENT ================= -->

    <linearGradient id="scan">

      <stop offset="0%"
        stop-color="#00f6ff"
        stop-opacity="0"/>

      <stop offset="50%"
        stop-color="#00f6ff"
        stop-opacity="0.8"/>

      <stop offset="100%"
        stop-color="#00f6ff"
        stop-opacity="0"/>

    </linearGradient>

  </defs>


