<svg width="1160" height="520" viewBox="0 0 1160 520"
     xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- ================= BACKGROUND ================= -->

  <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#050608"/>
    <stop offset="45%" stop-color="#0b0d10"/>
    <stop offset="100%" stop-color="#020304"/>
  </linearGradient>

  <radialGradient id="reactorGlow">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="12%" stop-color="#fff4cf"/>
    <stop offset="28%" stop-color="#ffd34d"/>
    <stop offset="55%" stop-color="#ff6a00" stop-opacity="0.65"/>
    <stop offset="100%" stop-color="#ff2600" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="redGlow">
    <stop offset="0%" stop-color="#ff3b18" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="arcMetal" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#5a5f64"/>
    <stop offset="25%" stop-color="#17191c"/>
    <stop offset="50%" stop-color="#9b9fa3"/>
    <stop offset="75%" stop-color="#25282c"/>
    <stop offset="100%" stop-color="#070809"/>
  </linearGradient>

  <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#6b3c00"/>
    <stop offset="25%" stop-color="#d99218"/>
    <stop offset="50%" stop-color="#ffe28a"/>
    <stop offset="75%" stop-color="#b86b00"/>
    <stop offset="100%" stop-color="#4a2700"/>
  </linearGradient>

  <pattern id="techGrid"
           width="28"
           height="28"
           patternUnits="userSpaceOnUse">

    <path d="M28 0H0V28"
          fill="none"
          stroke="#5b3a18"
          stroke-width="0.5"
          opacity="0.25"/>

  </pattern>

  <!-- ================= GLOWS ================= -->

  <filter id="glow"
          x="-100%"
          y="-100%"
          width="300%"
          height="300%">

    <feGaussianBlur stdDeviation="2.5" result="blur"/>

    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>

  </filter>

  <filter id="strongGlow"
          x="-150%"
          y="-150%"
          width="400%"
          height="400%">

    <feGaussianBlur stdDeviation="7" result="blur"/>

    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>

  </filter>

  <!-- ================= SCAN ================= -->

  <linearGradient id="scanLine">

    <stop offset="0%"
          stop-color="#ff4b1f"
          stop-opacity="0"/>

    <stop offset="50%"
          stop-color="#ffd45c"
          stop-opacity="0.8"/>

    <stop offset="100%"
          stop-color="#ff4b1f"
          stop-opacity="0"/>

  </linearGradient>

</defs>


<!-- ========================================================= -->
<!-- MAIN BODY                                                   -->
<!-- ========================================================= -->

<rect
  width="1160"
  height="520"
  rx="20"
  fill="url(#hudBg)"/>

<rect
  width="1160"
  height="520"
  rx="20"
  fill="url(#techGrid)"/>

<rect
  x="2"
  y="2"
  width="1156"
  height="516"
  rx="19"
  fill="none"
  stroke="#6d3b13"
  stroke-width="2"/>


<!-- RED ATMOSPHERE -->

<circle
  cx="180"
  cy="250"
  r="260"
  fill="url(#redGlow)"/>

<circle
  cx="980"
  cy="250"
  r="260"
  fill="url(#redGlow)"/>


