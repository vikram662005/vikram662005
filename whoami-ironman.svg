  fill="#baff9b">

  BUILD STATUS : ACTIVE

</text>


<!-- ========================================================= -->
<!-- ARC REACTOR                                                -->
<!-- ========================================================= -->

<g transform="translate(580 275)">


  <!-- Outer glow -->

  <circle
    r="145"
    fill="url(#reactorGlow)"
    filter="url(#strongGlow)"
    opacity="0.35">

    <animate
      attributeName="opacity"
      values="0.15;0.4;0.15"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>


  <!-- Outer metal -->

  <circle
    r="115"
    fill="none"
    stroke="url(#arcMetal)"
    stroke-width="12"/>


  <!-- Gold ring -->

  <circle
    r="98"
    fill="none"
    stroke="url(#goldMetal)"
    stroke-width="3"
    stroke-dasharray="32 10"
    filter="url(#glow)">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0"
      to="360"
      dur="10s"
      repeatCount="indefinite"/>

  </circle>


  <!-- Inner ring -->

  <circle
    r="82"
    fill="none"
    stroke="#ffb52e"
    stroke-width="2"
    stroke-dasharray="5 9"
    opacity="0.8">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="360"
      to="0"
      dur="5s"
      repeatCount="indefinite"/>

  </circle>


  <!-- Reactor core -->

  <circle
    r="70"
    fill="#0b0d0e"
    stroke="#ffca4d"
    stroke-width="2"/>


  <circle
    r="55"
    fill="url(#reactorGlow)"
    filter="url(#strongGlow)">

    <animate
      attributeName="r"
      values="45;62;45"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>


  <!-- Triangular arc reactor -->

  <path
    d="M0,-43 L37,25 L-37,25 Z"
    fill="none"
    stroke="#ffe49a"
    stroke-width="4"
    filter="url(#glow)"/>


  <path
    d="M0,-31 L27,18 L-27,18 Z"
    fill="#ffd34d"
    opacity="0.75"
    filter="url(#strongGlow)"/>


  <path
    d="M0,-21 L18,12 L-18,12 Z"
    fill="#ffffff"
    filter="url(#glow)"/>


  <!-- Energy rays -->

  <g
    stroke="#ffcf58"
    stroke-width="2"
    filter="url(#glow)">

    <line x1="0" y1="-132" x2="0" y2="-116"/>

    <line x1="0" y1="116" x2="0" y2="132"/>

    <line x1="-132" y1="0" x2="-116" y2="0"/>

    <line x1="116" y1="0" x2="132" y2="0"/>

  </g>


  <!-- rotating targeting brackets -->

  <path
    d="M-126,-35 L-126,-65 L-96,-65"
    fill="none"
    stroke="#ff4b1f"
    stroke-width="2">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0"
      to="360"
      dur="12s"
      repeatCount="indefinite"/>

  </path>

</g>


